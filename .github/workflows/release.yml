# Publishes a GitHub Release when a version tag is pushed (docs/CI.md, "Releases").
#
# The tag is made by a person (or an assistant) on a commit whose default-branch CI run is green; this workflow only
# turns the tag into a release, with the notes taken from that version's section of CHANGELOG.md. It runs nothing from
# the repository except the few lines below, and has no access to the Python or Node toolchains.

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 - "$version" <<'PY'
          import re, sys
          version = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(r"^## \[" + re.escape(version) + r"\] - [^\n]*\n(.*?)(?=^## \[|\Z)", text, re.S | re.M)
          if not match:
              sys.exit("CHANGELOG.md has no section for version " + version)
          heading = re.search(r"^## \[" + re.escape(version) + r"\] - ([^\n]*)", text, re.M).group(1)
          # The summary above the first sub-heading; the per-slice detail stays in CHANGELOG.md.
          summary = re.split(r"^### ", match.group(1), maxsplit=1, flags=re.M)[0].strip()
          link = "https://github.com/" + __import__("os").environ["GITHUB_REPOSITORY"] + "/blob/" + __import__("os").environ["GITHUB_REF_NAME"] + "/CHANGELOG.md"
          open("release-notes.md", "w", encoding="utf-8").write(summary + "\n\nThe full change list for this release is in [CHANGELOG.md](" + link + ").\n")
          open("release-title.txt", "w", encoding="utf-8").write("NovaLang v" + version + " -- " + heading.split("—", 1)[-1].strip())
          PY
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$(cat release-title.txt)" --notes-file release-notes.md
