# NovaLang CI. See docs/CI.md for what each job means and how to change it.
#
#   fast  the --quick tier of tests/run_all.py. Runs on every pull request and
#         on pushes to the default branch. This is the required check.
#   full  the whole suite across a Python/OS matrix. Runs on pushes to the
#         default branch, weekly, and on demand (a dispatch may pick rows and a
#         station). Rows marked `probe` report but cannot fail the run, until
#         they have passed once (docs/CI.md). The matrix is in the `plan` job.
#
# Actions are pinned to commit SHAs (the tag is in the trailing comment);
# Dependabot keeps them current.

name: CI

on:
  pull_request:
  push:
  schedule:
    - cron: "17 5 * * 1"   # Mondays, 05:17 UTC
  workflow_dispatch:
    inputs:
      rows:
        description: "Matrix rows to run, comma-separated os/python (e.g. windows-latest/3.7). Empty runs them all."
        required: false
        default: ""
      station:
        description: "Run only this run_all.py station (e.g. differential). Empty runs the whole suite."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUTF8: "1"          # the suite's own output and fixtures are UTF-8
  PYTHONFAULTHANDLER: "1"  # a native crash (stack overflow, access violation) prints a traceback

jobs:
  fast:
    name: fast
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install NumPy (the examples station needs it)
        run: python -m pip install numpy
      - name: Versions
        run: |
          python --version
          node --version
          git --version
      - name: Quick tier
        run: python -u tests/run_all.py --quick --report checks.jsonl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: checks-fast
          path: checks.jsonl
          if-no-files-found: ignore
          retention-days: 14

  # The matrix lives here, not in the full job, so a dispatch can pick rows
  # (`rows`) and a station (`station`): a single row's traceback should not
  # cost a whole matrix run. Inputs reach the script through the environment,
  # never through string interpolation into it.
  plan:
    name: plan
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      args: ${{ steps.plan.outputs.args }}
    steps:
      - id: plan
        env:
          ROWS: ${{ inputs.rows }}
          STATION: ${{ inputs.station }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys

          # Required: seen passing on GitHub (docs/CI.md has the run).
          # Probes report but cannot fail the run. Windows 3.12 passed run 15
          # and is required; Windows 3.7 stays a probe because its generated-
          # program comparison skips 16 of 300 programs (docs/CI.md).
          rows = [
              ("ubuntu-24.04", "3.13", False),
              ("ubuntu-24.04", "3.12", False),
              ("ubuntu-24.04", "3.11", False),
              ("ubuntu-22.04", "3.10", False),
              ("ubuntu-22.04", "3.9", False),
              ("ubuntu-22.04", "3.8", False),
              ("ubuntu-22.04", "3.7", False),
              ("macos-latest", "3.12", False),
              ("windows-latest", "3.12", False),
              ("windows-latest", "3.7", True),
          ]
          wanted = [r.strip() for r in os.environ.get("ROWS", "").split(",") if r.strip()]
          known = {os_ + "/" + py for os_, py, _ in rows}
          unknown = [r for r in wanted if r not in known]
          if unknown:
              sys.exit("unknown row(s): {}; known: {}".format(unknown, sorted(known)))
          chosen = [r for r in rows if not wanted or r[0] + "/" + r[1] in wanted]
          station = os.environ.get("STATION", "").strip()
          if station and not re.fullmatch(r"[a-z0-9-]+", station):
              sys.exit("bad station name: {!r}".format(station))
          matrix = {"include": [{"os": o, "python": p, "probe": probe} for o, p, probe in chosen]}
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("matrix=" + json.dumps(matrix) + "\n")
              out.write("args=" + ("--station " + station if station else "") + "\n")
          print(json.dumps(matrix, indent=1), "args:", station or "(whole suite)")
          PY

  full:
    name: full (${{ matrix.os }}, py${{ matrix.python }})
    needs: plan
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.probe }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner downloads old Pythons (3.7 to 3.10) from GitHub's python-versions
      # mirror, which now and then answers HTTP 504 three times in a row and fails the
      # job before any test runs. Try again, twice, after a pause; only the last attempt
      # may fail the job, so a real problem still does (docs/CI.md).
      - id: python1
        continue-on-error: true
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Pause, then retry setup-python (attempt 2)
        if: steps.python1.outcome == 'failure'
        shell: bash
        run: sleep 45
      - id: python2
        if: steps.python1.outcome == 'failure'
        continue-on-error: true
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Pause, then retry setup-python (attempt 3)
        if: steps.python1.outcome == 'failure' && steps.python2.outcome == 'failure'
        shell: bash
        run: sleep 90
      - name: setup-python (attempt 3, final)
        if: steps.python1.outcome == 'failure' && steps.python2.outcome == 'failure'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install NumPy (the examples station needs it)
        run: python -m pip install numpy
      - name: Versions
        run: |
          python --version
          node --version
          git --version
      - name: Full suite
        shell: bash
        env:
          RUN_ARGS: ${{ needs.plan.outputs.args }}   # a validated --station NAME, or empty
        run: python -u tests/run_all.py --report checks.jsonl $RUN_ARGS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: checks-${{ matrix.os }}-py${{ matrix.python }}
          path: checks.jsonl
          if-no-files-found: ignore
          retention-days: 14
